spring:
  datasource:
    url: jdbc:tc:postgresql:16:///test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
pft:
  inbox:
    enabled: false
    dir: ${java.io.tmpdir}/pft-test/inbox
  reports:
    outbox-dir: ${java.io.tmpdir}/pft-test/outbox
    live-spreadsheet: false
    pdf:
      enabled: false
