spring:
  config:
    # Personal settings live outside the repository. Override the location with -Dpft.config-file=... (tests do).
    import: optional:file:${pft.config-file:${user.home}/.config/finance-tracker/application.yml}
  banner:
    location: banner.txt
  flyway:
    enabled: true
    schemas: personal_finance_tracker
    # db/seed holds default data (categories) for the app only; tests use db/migration alone.
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    database: default
    open-in-view: false
    generate-ddl: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false

  datasource:
    driver-class-name: org.postgresql.Driver
    url: 'jdbc:postgresql://localhost:5433/pft?ApplicationName=pft-service'
    username: pft
    password: pft
    hikari:
      minimum-idle: 5
      maximum-pool-size: 25
      idle-timeout: 30000

  jackson:
    # Jackson 3 (Boot 4) writes java.time values as ISO-8601 strings by default.
    default-property-inclusion: always

pft:
  # People in the household: define them in ~/.config/finance-tracker/application.yml (see local/finance-tracker.example.yml)
  # so names stay out of git. Transactions without a person belong to household.default-person (or the first person).
  # household:
  #   default-person: ivo
  #   people:
  #     - username: ivo
  #       name: Ivo
  reports:
    # Spreadsheets and PDFs are written here.
    outbox-dir: ${user.home}/finance/outbox
    # Rewrite <yyyy-MM>-report.xlsx and transactions.csv whenever data changes.
    live-spreadsheet: true
    pdf:
      enabled: true
      # From this day on, last month's PDF is generated (once); the gap leaves time to add late receipts.
      day-of-month: 2
      # Daily check (plus one at startup, which catches up on runs missed while the machine was off).
      check-cron: "0 0 8 * * *"
